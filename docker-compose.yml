services:
  openclaw:
    image: ${OPENCLAW_IMAGE:-openclaw:local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        OPENCLAW_VERSION: ${OPENCLAW_VERSION:-latest}
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      HOME: /home/node
      OPENCLAW_HOME: /home/node
      OPENCLAW_STATE_DIR: /home/node/.openclaw
      OPENCLAW_CONFIG_PATH: /home/node/.openclaw/openclaw.json
      OPENCLAW_WORKSPACE_DIR: /home/node/.openclaw/workspace
      OPENCLAW_GATEWAY_PORT: ${OPENCLAW_GATEWAY_PORT:-18789}
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:?Set OPENCLAW_GATEWAY_TOKEN in .env}
      OPENCLAW_LOG_LEVEL: ${OPENCLAW_LOG_LEVEL:-info}
      SWISSCOM_BASE_URL: ${SWISSCOM_BASE_URL:-https://api.swisscom.com/products/swiss-ai-weeks/apertus-1.5-70b/v1}
      SWISSCOM_MODEL: ${SWISSCOM_MODEL:-apertus-1.5-70b}
      SWISSCOM_API_KEY: ${SWISSCOM_API_KEY:?Set SWISSCOM_API_KEY in .env}
    ports:
      - "${OPENCLAW_BIND_ADDRESS:-127.0.0.1}:${OPENCLAW_HOST_PORT:-18789}:${OPENCLAW_GATEWAY_PORT:-18789}"
    volumes:
      - openclaw-data:/home/node/.openclaw
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true

volumes:
  openclaw-data:
